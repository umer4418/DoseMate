name: dosemate
description: "Daily medicine tracking and doctor consultation app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2

  get: ^4.7.2
  google_sign_in: ^6.2.2
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generate Android and iOS app icons
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

  assets:
    - assets/images/


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/dosesplash.png"

  # Removes transparency from iOS icon if necessary
  remove_alpha_ios: true

  # Android minimum SDK
  min_sdk_android: 21