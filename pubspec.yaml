name: dosemate
description: "Daily medicine tracking and doctor consultation app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.2

  get: ^4.7.2
  google_sign_in: ^6.2.2
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  intl: ^0.20.2
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
